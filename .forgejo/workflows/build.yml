# Rebuild every README from the templates in src/ and commit the result to main.
# Forgejo then push-mirrors that commit to GitHub, like any other.
#
# Edit only src/ (from a clone or in the web editor); this workflow writes the READMEs.
# The commit it pushes does not start the workflow again: Forgejo never triggers
# workflows from pushes made with the automatic token, and the paths below would
# not match a README-only commit anyway.
name: build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.py"
      - ".forgejo/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Has git and python3 besides node, which the checkout action needs.
      image: node:22-bookworm
    steps:
      - name: Check out
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Render the READMEs
        run: python3 build.py

      - name: Commit and push them if they changed
        run: |
          git add -- 'README*.md' '.github/README*.md'
          if git diff --cached --quiet; then
            echo "READMEs already up to date"
            exit 0
          fi
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.source.tiagoagueda.com"
          git commit -m "Rebuild READMEs from src/" -m "Generated by build.py for ${GITHUB_SHA}."
          # If main moved on meanwhile, this push is refused and the run for the newer
          # commit rebuilds from it instead.
          git push origin HEAD:main
